title: make comp110 better!
email: jinyizhang1031@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  This project analyzes student survey data from a programming course to understand what factors help improve student learning. The main focus is on whether practice-based learning, such as programming assignments and lesson questions, is related to students’ understanding of course material. 
  Using Python and Seaborn, the data was processed and visualized through different charts, including scatter plots, line plots, box plots, and bar plots. These visualizations were used to explore relationships between variables like programming effectiveness, lesson question effectiveness, understanding, and difficulty. 
  The results suggest that students who find practice activities more effective tend to report higher levels of understanding. Based on this, the project recommends increasing structured practice opportunities in the course to support student learning.
